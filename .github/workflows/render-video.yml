name: Render random video

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (để trống = ngẫu nhiên)"
        required: false
      duration:
        description: "Ép thời lượng giây (để trống = ngẫu nhiên 180-360s)"
        required: false
      upload:
        description: "Upload lên YouTube sau khi dựng (true/false)"
        required: false
        default: "true"
      privacy:
        description: "Chế độ hiển thị: public / unlisted / private"
        required: false
        default: "public"
  schedule:
    - cron: "0 1 * * *"

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cài FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Cài thư viện Python
        run: pip install -r requirements.txt

      - name: Cài Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Chọn chất liệu ngẫu nhiên từ host
        env:
          ASSET_HOST_URL: ${{ secrets.ASSET_HOST_URL }}
          ASSET_HOST_TOKEN: ${{ secrets.ASSET_HOST_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ inputs.seed }}" ] && ARGS="$ARGS --seed ${{ inputs.seed }}"
          [ -n "${{ inputs.duration }}" ] && ARGS="$ARGS --duration ${{ inputs.duration }}"
          python -m render.prepare --plan plan.json $ARGS

      - name: Dựng video 2K bằng game gốc (thanh máu, chữ, hiệu ứng, âm thanh)
        run: node runner/render.mjs --plan plan.json --out output --width 2560 --height 1440 --fps 30

      - uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/*
          retention-days: 7

      - name: Tạo SEO bằng DeepSeek và upload YouTube
        if: ${{ inputs.upload != 'false' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: python -m render.publish --dir output --privacy ${{ inputs.privacy || 'public' }}
