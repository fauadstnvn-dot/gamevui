name: Render random video

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (để trống = ngẫu nhiên)"
        required: false
      duration:
        description: "Ép thời lượng giây (để trống = ngẫu nhiên 180-360s)"
        required: false
      fps:
        description: "FPS video (60 / 30 / 24)"
        required: false
        default: "30"
      upload:
        description: "Upload lên YouTube sau khi dựng (true/false)"
        required: false
        default: "true"
      privacy:
        description: "Chế độ hiển thị: public / unlisted / private"
        required: false
        default: "public"
      intro:
        description: "Bật mở màn VS (thú cưỡi vs boss + quái, câu hỏi, đếm ngược 3-2-1, READY/GO)"
        type: boolean
        required: false
        default: false
      intro_style:
        description: "Kiểu ảnh mở màn (chỉ dùng khi bật mở màn)"
        type: choice
        required: false
        default: random
        options: [random, clash, inferno, cyber, arena, storm, frost, toxic, royal, void, sunset]
      intro_countdown:
        description: "Kiểu đồng hồ đếm ngược (chỉ dùng khi bật mở màn)"
        type: choice
        required: false
        default: random
        options: [random, ring, shock, tile, slice, stopwatch, radar, digital, hex]
      outro:
        description: "Bật cảnh kết thúc (công bố bên thắng + câu trả lời, thống kê, kêu gọi đăng ký kênh)"
        type: boolean
        required: false
        default: false
      outro_style:
        description: "Kiểu công bố bên thắng (chỉ dùng khi bật kết thúc)"
        type: choice
        required: false
        default: random
        options: [random, trophy, ko, crown, fireworks, suspense, stamp]
      stats_style:
        description: "Kiểu bảng thống kê (chỉ dùng khi bật kết thúc)"
        type: choice
        required: false
        default: random
        options: [random, cards, ticker, gauges, billboard]
      cta_style:
        description: "Kiểu kêu gọi đăng ký (chỉ dùng khi bật kết thúc)"
        type: choice
        required: false
        default: random
        options: [random, button, neon, banner, icons]
      channel_name:
        description: "Tên kênh hiển thị ở cảnh kết thúc (để trống = chỉ ghi SUBSCRIBE)"
        required: false
  schedule:
    - cron: "0 1 * * *"

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cài FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Cài thư viện Python
        run: pip install -r requirements.txt

      - name: Cài Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Chọn chất liệu từ host (kịch bản ưu tiên trước, thiếu thì ngẫu nhiên)
        env:
          ASSET_HOST_URL: ${{ secrets.ASSET_HOST_URL }}
          ASSET_HOST_TOKEN: ${{ secrets.ASSET_HOST_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ inputs.seed }}" ] && ARGS="$ARGS --seed ${{ inputs.seed }}"
          [ -n "${{ inputs.duration }}" ] && ARGS="$ARGS --duration ${{ inputs.duration }}"
          python -m render.prepare --plan plan.json $ARGS

      - name: Dựng video 2K bằng game gốc (thanh máu, chữ, hiệu ứng, âm thanh)
        run: node runner/render.mjs --plan plan.json --out output --width 2560 --height 1440 --fps ${{ inputs.fps || 30 }} --timeout 340

      - name: Dựng mở màn VS và cảnh kết thúc rồi ghép vào video (tùy chọn)
        # Chạy tay: theo ô "intro" / "outro". Chạy theo lịch (cron): bật nếu biến repo INTRO_DEFAULT / OUTRO_DEFAULT = true.
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.intro || inputs.outro)) || (github.event_name != 'workflow_dispatch' && (vars.INTRO_DEFAULT == 'true' || vars.OUTRO_DEFAULT == 'true')) }}
        env:
          INTRO_ON: ${{ github.event_name == 'workflow_dispatch' && (inputs.intro && 'true' || 'false') || (vars.INTRO_DEFAULT == 'true' && 'true' || 'false') }}
          OUTRO_ON: ${{ github.event_name == 'workflow_dispatch' && (inputs.outro && 'true' || 'false') || (vars.OUTRO_DEFAULT == 'true' && 'true' || 'false') }}
          INTRO_STYLE: ${{ inputs.intro_style || 'random' }}
          INTRO_COUNTDOWN: ${{ inputs.intro_countdown || 'random' }}
          OUTRO_STYLE: ${{ inputs.outro_style || 'random' }}
          STATS_STYLE: ${{ inputs.stats_style || 'random' }}
          CTA_STYLE: ${{ inputs.cta_style || 'random' }}
          CHANNEL_NAME: ${{ inputs.channel_name || vars.CHANNEL_NAME || '' }}
        run: >
          node runner/intro.mjs --plan plan.json --out output --width 2560 --height 1440 --fps ${{ inputs.fps || 30 }}
          --intro "$INTRO_ON" --outro "$OUTRO_ON"
          --style "$INTRO_STYLE" --countdown "$INTRO_COUNTDOWN"
          --outro-style "$OUTRO_STYLE" --stats-style "$STATS_STYLE" --cta-style "$CTA_STYLE"

      - name: Tạo SEO bằng DeepSeek và upload YouTube
        id: publish
        if: ${{ inputs.upload != 'false' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: python -m render.publish --dir output --category 20 --privacy ${{ inputs.privacy || 'public' }}

      - name: Xóa kịch bản ưu tiên và cảnh chon-canh-vat đã dùng (sau khi upload thành công)
        if: ${{ success() && (steps.publish.outcome == 'success' || inputs.upload == 'false') }}
        env:
          ASSET_HOST_URL: ${{ secrets.ASSET_HOST_URL }}
          ASSET_HOST_TOKEN: ${{ secrets.ASSET_HOST_TOKEN }}
        run: python -m render.cleanup --plan plan.json

      - name: Giữ lại video nếu chưa upload thành công (để tải về thủ công)
        if: ${{ always() && steps.publish.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Dọn file tạm
        if: ${{ always() }}
        run: rm -rf .work .cache plan.json app/game/scenery app/game/rig app/game/bosses app/game/monsters
