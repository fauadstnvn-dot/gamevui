name: Render random video

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (để trống = ngẫu nhiên)"
        required: false
      duration:
        description: "Ép thời lượng giây (để trống = ngẫu nhiên 180-360s)"
        required: false
  schedule:
    - cron: "0 1 * * *"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Cài thư viện Python
        run: pip install -r requirements.txt

      - name: Dựng video 2K
        env:
          ASSET_HOST_URL: ${{ secrets.ASSET_HOST_URL }}
          ASSET_HOST_TOKEN: ${{ secrets.ASSET_HOST_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ inputs.seed }}" ] && ARGS="$ARGS --seed ${{ inputs.seed }}"
          [ -n "${{ inputs.duration }}" ] && ARGS="$ARGS --duration ${{ inputs.duration }}"
          python -m render.main --out output $ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/*
          retention-days: 7
